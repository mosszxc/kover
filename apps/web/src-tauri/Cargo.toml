[package]
name = "kover"
version = "0.1.0"
description = "Kover — система управления маршрутами"
authors = ["Kover Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
