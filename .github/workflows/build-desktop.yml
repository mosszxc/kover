name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web app
        run: pnpm build
        env:
          NODE_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Create PWA archive
        run: |
          cd apps/web/dist
          zip -r ../../../Kover-PWA-${{ github.ref_name }}.zip .

      - name: Create release and upload PWA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Kover-PWA-${{ github.ref_name }}.zip" \
            --title "Kover ${{ github.ref_name }}" \
            --notes "## Kover ${{ github.ref_name }}

          ### PWA (Web)
          \`Kover-PWA-${{ github.ref_name }}.zip\` — статическая сборка для самостоятельного хостинга.
          Разверните на любом веб-сервере. Поддерживает установку как приложение и работу offline."
