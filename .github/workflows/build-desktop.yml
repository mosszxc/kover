name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pwa:
    name: Build PWA
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web app
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Create PWA archive
        run: |
          cd apps/web/dist
          zip -r ../../../Kover-PWA-${{ github.ref_name }}.zip .

      - name: Upload PWA to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "Kover-PWA-${{ github.ref_name }}.zip" \
            --clobber


  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri -> target

      - name: Install dependencies
        run: pnpm install

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd apps/web/src-tauri
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/web
          tagName: ${{ github.ref_name }}
          releaseName: Kover ${{ github.ref_name }}
          releaseBody: |
            ## Kover ${{ github.ref_name }}

            ### Windows (Desktop)
            Скачайте `Kover-Setup-${{ github.ref_name }}.exe` и запустите установщик.
            Если у вас уже установлен Kover — обновление произойдёт автоматически.

            ### macOS (Desktop)
            Скачайте `.dmg` файл для вашей архитектуры (Apple Silicon / Intel).

            ### PWA (Web)
            `Kover-PWA-${{ github.ref_name }}.zip` — статическая сборка для самостоятельного хостинга.
            Разверните на любом веб-сервере. Поддерживает установку как приложение и работу offline.

            ### KoverBot (Telegram AI-бот)
            - `KoverBot-install.bat` — установка бота на Windows 11 (WSL2)
            - `KoverBot-update.bat` — обновление бота
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Upload KoverBot scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            scripts/koverbot-install.bat \
            scripts/koverbot-update.bat \
            --clobber

  build-macos:
    name: Build macOS (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri -> target

      - name: Install dependencies
        run: pnpm install

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd apps/web/src-tauri
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/web
          tagName: ${{ github.ref_name }}
          releaseName: Kover ${{ github.ref_name }}
          args: --target ${{ matrix.target }}
          releaseDraft: false
          prerelease: false
