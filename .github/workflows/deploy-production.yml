name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=prod-
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.ref_name }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  approve:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: [build-web]
    environment: production
    steps:
      - name: Approval checkpoint
        run: echo "Deployment approved by ${{ github.actor }}"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [approve, build-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record current deployment
        id: record
        run: |
          echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Web Image: ${{ needs.build-web.outputs.image }}"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for deployment propagation
        run: sleep 60

      - name: Web health check
        id: web-health
        run: |
          for i in {1..5}; do
            if curl -sf ${{ secrets.PROD_WEB_URL }}; then
              echo "Web healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          exit 1

  rollback:
    name: Rollback (on failure)
    runs-on: ubuntu-latest
    needs: [health-check]
    if: failure()
    steps:
      - name: Rollback deployment
        run: |
          echo "Health check failed! Rolling back..."

      - name: Notify rollback
        uses: slackapi/slack-github-action@v2.0.0
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: Production deployment ROLLED BACK",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Production Deployment ROLLED BACK*\nHealth check failed after deployment.\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [health-check]
    if: success()
    steps:
      - name: Slack notification (success)
        uses: slackapi/slack-github-action@v2.0.0
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Production deployment succeeded",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *Production Deployment Succeeded*\nCommit: `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
