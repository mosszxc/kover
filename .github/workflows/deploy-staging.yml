name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=${{ secrets.STAGING_API_URL }}
            VITE_SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deploy step placeholder - configure based on your infrastructure
      # Options: Kubernetes, Docker Compose on VPS, Vercel, Railway, etc.
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "API Image: ${{ needs.build-api.outputs.image }}"
          echo "Web Image: ${{ needs.build-web.outputs.image }}"
          # Add your deployment commands here:
          # - kubectl set image deployment/api api=${{ needs.build-api.outputs.image }}
          # - ssh user@staging 'docker compose pull && docker compose up -d'

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check API
        run: |
          curl -f ${{ secrets.STAGING_API_URL }}/health || exit 1

      - name: Health check Web
        run: |
          curl -f ${{ secrets.STAGING_WEB_URL }} || exit 1

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [smoke-test]
    if: always()
    steps:
      - name: Slack notification
        uses: slackapi/slack-github-action@v2.0.0
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Staging deployment ${{ needs.smoke-test.result == 'success' && 'succeeded' || 'failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ needs.smoke-test.result == 'success' && ':white_check_mark:' || ':x:' }} *Staging Deployment ${{ needs.smoke-test.result == 'success' && 'Succeeded' || 'Failed' }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
